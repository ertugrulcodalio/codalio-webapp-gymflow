model: BrandingSetting
slug: branding_settings
table: branding_settings

options:
  belongs_to_organization: true
  soft_deletes: false
  audit_trail: false
  pagination: true
  per_page: 25

columns:
  logo_url:
    type: string
    nullable: true
  primary_color:
    type: string
    nullable: true

relationships:
  - type: belongsTo
    model: Organization

permissions:
  gym_staff:
    actions: [index, show, store, update, destroy]
    show_fields: "*"
    create_fields: "*"
    update_fields: "*"
  gym_member:
    actions: [index, show]
    show_fields: [id, logo_url, primary_color]
    create_fields: []
    update_fields: []
